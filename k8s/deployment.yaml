apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-service
          image: asia-northeast3-docker.pkg.dev/trusta-market-id/trusta-registry-services/payment-service:PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8301
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-postgres-secrets
                  key: DB_PASSWORD
            # TOSS 결제 키 — Secret 'payment-secrets' 미리 생성 필요 (dummy 값 가능).
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: TOSS_SECRET_KEY
            - name: TOSS_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: TOSS_CLIENT_KEY
            - name: TOSS_CUSTOMER_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: TOSS_CUSTOMER_KEY
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 2500Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8301
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8301
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8301
            periodSeconds: 5
