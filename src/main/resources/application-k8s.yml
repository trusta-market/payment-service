# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8301

spring:
  config:
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
  datasource:
    url: jdbc:postgresql://postgres:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  # Kafka — 현재 payment-service 는 dependency 없음 (Spring 이 무시).
  # 다른 서비스들과 일관성 차원 + 향후 도입 시 대비.
  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# common 의 LoginFilter 가 gateway 의 X-User-* 헤더 → SecurityContext 로 주입.
# false (default) 면 LoginFilter 가 전체 skip → SecurityContext 미설정 →
# /internal/** 등 인증 필요한 path 가 401 반환. wallet → payment Feign 호출이 깨짐.
trusta:
  security:
    trust-gateway-headers: true
